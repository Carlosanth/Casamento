:root{--background:oklch(.985 .004 85);--foreground:oklch(.27 .015 25);--primary:oklch(.38 .115 15);--muted:oklch(.53 .018 30);--border:oklch(.87 .012 65);--paper:oklch(1 0 0);--sage:oklch(.5 .045 145);--wine-light:oklch(.48 .12 15);--wine-dark:oklch(.32 .1 15);--black:oklch(.22 .005 25);--shadow:0 8px 30px oklch(.27 .015 25/.06);font-family:Texto,sans-serif;color:var(--foreground);background:var(--background);letter-spacing:0}
*{box-sizing:border-box}body{margin:0}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:5px}button:disabled{opacity:.28;cursor:default}header{max-width:1320px;margin:auto;padding:26px 50px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}.identity{display:flex;gap:16px;align-items:center;text-decoration:none}.monogram{font:italic 36px Atelier;color:var(--primary)}.brand{font-size:10px;letter-spacing:2px;text-transform:uppercase}.header-actions{display:flex;gap:24px;align-items:center}.version{font-size:11px;text-decoration:none;color:var(--muted)}.version.current{color:var(--primary);border-bottom:1px solid var(--primary);padding-bottom:5px}.download{display:flex;gap:7px;align-items:center;font-size:11px;text-decoration:none}.icon{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.4}.chapters{max-width:1220px;margin:0 auto;padding:23px 0;display:flex;gap:34px;border-bottom:1px solid var(--border)}.chapter{border:0;background:none;color:var(--muted);padding:0;font-size:11px;white-space:nowrap}.chapter.active{color:var(--primary)}.chapter span{font-size:9px;margin-right:8px;opacity:.6}.sheet{max-width:1120px;min-height:calc(100svh - 247px);margin:auto;padding:44px 0 35px;position:relative}.scene{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;animation:rise .55s ease both}.scene.backward{animation-name:fall}.eyebrow{display:flex;gap:12px;align-items:center;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--primary);margin-bottom:22px}.eyebrow:before{content:'';height:1px;width:30px;background:var(--primary)}h1,h2,h3,p{margin-top:0}h1{font:normal 76px/1.02 Atelier;margin-bottom:22px}h1 em{color:var(--primary);font-weight:normal}h2{font:normal 30px Atelier;margin-bottom:14px}p{font-size:13px;line-height:1.9;color:var(--muted);margin-bottom:17px}.lead{font:italic 23px/1.5 Atelier;color:var(--foreground)}.signature{font:italic 32px Atelier;color:var(--primary);margin:24px 0}.fine{font-size:10px;line-height:1.7;color:var(--muted)}.primary-button{border:1px solid var(--primary);background:var(--primary);color:var(--paper);padding:15px 22px;display:inline-flex;align-items:center;gap:30px;font-size:11px;transition:opacity .2s}.primary-button:hover{opacity:.85}.drawing{margin:0;position:relative;text-align:center;align-self:center}.drawing img{display:block;max-width:100%;width:400px;height:540px;object-fit:contain;margin:auto;mix-blend-mode:multiply}.drawing figcaption{font:italic 15px Atelier;color:var(--muted);margin:12px 0}.drawing .stamp{position:absolute;right:0;top:60px;font-size:9px;writing-mode:vertical-rl;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}.section-number{font:italic 85px Atelier;color:var(--border);position:absolute;right:0;top:0;z-index:-1}.detail-list{list-style:none;padding:0;margin:25px 0}.detail-list li{border-top:1px solid var(--border);padding:12px 0;display:flex;align-items:baseline;gap:15px;font-size:12px;line-height:1.65}.detail-list li:last-child{border-bottom:1px solid var(--border)}.detail-list .index{font-size:9px;color:var(--primary);flex:0 0 20px}.detail-list strong{font-weight:normal;color:var(--primary)}.tags{display:flex;flex-wrap:wrap;gap:9px 20px;margin-bottom:20px}.tags span{font-size:11px;display:flex;align-items:center;gap:7px}.tags span:before{content:'✓';color:var(--sage)}.palette{display:flex;gap:16px;margin:28px 0}.swatch{width:68px;height:82px;border-radius:38px 38px 2px 2px;background:var(--primary)}.swatch.light{background:var(--wine-light)}.swatch.dark{background:var(--wine-dark)}.swatch.black{background:var(--black)}.swatch.white{background:var(--paper);border:1px solid var(--border)}.swatch-label{font-size:9px;text-align:center;display:block;margin-top:10px;color:var(--muted)}.note{border-left:2px solid var(--primary);padding:0 0 0 17px;margin:24px 0}.note p{font-size:11px}.big-time{font:normal 110px Atelier;color:var(--primary);line-height:1;margin:25px 0 8px}.time-caption{font-size:10px;letter-spacing:2px;text-transform:uppercase}.event-details{display:grid;gap:18px;margin:25px 0}.event-details div{padding-bottom:14px;border-bottom:1px solid var(--border)}.event-details small{display:block;font-size:9px;color:var(--primary);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}.event-details span{font-size:13px;color:var(--muted)}.quote{font:italic 40px/1.2 Atelier;color:var(--primary);padding:30px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.flower{width:100px;height:100px;stroke:var(--primary);fill:none;stroke-width:.7;display:block;margin:20px auto}.closing{text-align:center;max-width:590px;margin:auto;padding:30px 0}.closing h1{font-size:72px}.closing .eyebrow{justify-content:center}.closing .eyebrow:before{display:none}.closing p{max-width:450px;margin:0 auto 20px}.closing .signature{font-size:44px}.footer-wrap{position:sticky;bottom:0;z-index:5;background:var(--background)}footer{max-width:1220px;margin:auto;border-top:1px solid var(--border);padding:17px 0;display:flex;justify-content:space-between;align-items:center}.footer-note{font:italic 15px Atelier;color:var(--muted)}.page-controls{display:flex;align-items:center;gap:23px}.arrow-button{background:none;border:1px solid var(--border);width:38px;height:38px;display:grid;place-items:center;color:var(--primary);border-radius:50%}.arrow-button:hover:not(:disabled){background:var(--paper)}.counter{font-size:10px;color:var(--muted);min-width:38px;text-align:center}.counter b{color:var(--primary);font-weight:normal}.progress{display:flex;gap:5px}.progress i{width:20px;height:2px;background:var(--border)}.progress i.active{background:var(--primary)}.footer-center{display:flex;align-items:center;gap:20px}.footer-center small{font-size:10px;color:var(--muted)}@keyframes rise{from{opacity:0;trans const pages = [
{label:'Boas-vindas',html:()=>`<div class="scene intro"><div class="copy"><div class="eyebrow">Para quem faz parte da nossa história</div><h1>Manual ${female?'das':'dos'}<br><em>${group}</em></h1><p class="lead">O nosso sim também tem um pedacinho de você.</p><p>Se você recebeu este manual, é porque ocupa um lugar muito especial em nossas vidas.</p><p class="intro-extra">Escolhemos você para estar ao nosso lado em um dos dias mais importantes da nossa história. Mais do que testemunhar nossa união, queremos compartilhar esse momento com pessoas que fizeram parte da nossa caminhada.</p><p class="intro-extra">Obrigados por aceitar esse convite. Sua presença significa muito para nós!</p><div class="signature">Carlos & Karine</div><button class="scroll-cue" data-next aria-label="Ir para o próximo capítulo">Deslize <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg></button></div></div>`},
{label:'O traje',html:()=>`<div class="scene outfit"><div class="copy"><div class="eyebrow">01 · Elegância em cada detalhe</div><h1>${female?'O seu':'Seu'} <em>${female?'vestido':'traje'}</em></h1><p>Para manter a harmonia da cerimônia, pedimos que siga estas orientações.</p>${female?`<ul class="detail-list"><li><span class="index">01</span><span><strong>Vestido longo</strong><br>O comprimento escolhido para todas as madrinhas.</span></li><li><span class="index">02</span><span><strong>Cor vinho</strong><br>Um tom profundo, elegante e cheio de personalidade.</span></li><li><span class="index">03</span><span><strong>Do seu jeito</strong><br>Modelo, tecido e acabamento ficam a seu critério.</span></li></ul><h2>Você pode escolher</h2><div class="tags"><span>Fenda</span><span>Decote com bom senso</span><span>Com ou sem mangas</span><span>Tecido liso</span><span>Brilho discreto</span></div><p class="fine">Mangas curtas ou longas também são permitidas. O croqui é uma inspiração: você não precisa usar o mesmo modelo.</p>`:`<ul class="detail-list"><li><span class="index">01</span><span><strong>Paletó vinho</strong><br>A cor que conecta todos os padrinhos.</span></li><li><span class="index">02</span><span><strong>Calça social preta</strong></span></li><li><span class="index">03</span><span><strong>Camisa branca</strong></span></li><li><span class="index">04</span><span><strong>Gravata preta</strong></span></li><li><span class="index">05</span><span><strong>Sapato social preto</strong></span></li></ul><p class="fine">Um conjunto clássico, com o vinho como protagonista.</p>`}</div>${drawing(female?'O modelo é seu. A harmonia é nossa.':'Cinco detalhes. Uma combinação especial.')}</div>`},
{label:'A paleta',html:()=>`<div class="scene color-scene"><div class="copy"><div class="eyebrow">02 · A cor do nosso dia</div><h1>Em tom de <em>vinho</em></h1><p class="lead">Uma mesma cor, muitas formas de ser você.</p><p>${female?'Procure um vinho equilibrado: nem vermelho vivo, nem tão escuro que pareça preto.':'O paletó vinho é a peça de destaque. O preto e o branco completam o conjunto com sobriedade.'}</p><div class="palette">${female?`<div><div class="swatch light"></div><span class="swatch-label">Vinho</span></div><div><div class="swatch"></div><span class="swatch-label">Referência</span></div><div><div class="swatch dark"></div><span class="swatch-label">Vinho profundo</span></div>`:`<div><div class="swatch"></div><span class="swatch-label">Vinho</span></div><div><div class="swatch black"></div><span class="swatch-label">Preto</span></div><div><div class="swatch white"></div><span class="swatch-label">Branco</span></div>`}</div><div class="note"><h2>${female?'Tons a evitar':'A combinação'}</h2><p>${female?'Vermelho vivo, marsala muito claro e bordô escuro quase preto.':'Paletó vinho; calça, gravata e sapatos pretos; camisa branca.'}</p></div><p class="fine">A paleta é uma referência visual. A cor pode variar conforme a tela, a iluminação e o tecido.</p></div>${drawing('Vinho · a cor que nos une')}</div>`},
{label:'O grande dia',html:()=>`<div class="scene event"><div class="copy"><div class="eyebrow">03 · Nosso encontro</div><h1>O grande <em>dia</em></h1><div class="event-details"><div><small>Data do casamento</small><span>Sábado, 21/11/2026</span></div><div><small>Horário da cerimônia</small><span>17h</span></div><div><small>Local</small><span>Rua Encanto da Barra, 110 · Barra do Ceará</span></div></div><h2>A sua chegada</h2><p>Pedimos que todos cheguem <strong>1 hora antes do início da cerimônia</strong>, ou seja, às <strong>16h</strong>, para organização, fotos e alinhamento da entrada.</p><div class="note"><p>Durante a cerimônia, mantenha o celular no modo silencioso. As fotos oficiais serão feitas por nossa equipe: aproveite para viver cada instante ao nosso lado.</p></div></div><div><div class="big-time">1 hora</div><div class="time-caption">Antes do início da cerimônia</div></div></div>`},
{label:'Celebre',html:()=>`<div class="scene celebrate"><div class="copy"><div class="eyebrow">04 · Depois do sim</div><h1>Agora é <em>celebrar</em></h1><h2>Primeiro, as lembranças</h2><p>Após a cerimônia, teremos fotos com os padrinhos e familiares. Pedimos apenas um pouquinho de paciência para que tudo aconteça da melhor forma possível.</p><div class="quote">Depois disso…<br>a missão é uma só:<br>comemorar muito!</div><p style="margin-top:24px">Queremos vocês na pista de dança, sorrindo, brindando e aproveitando cada segundo conosco.</p></div></div>`},
{label:'Com carinho',html:()=>`<div class="scene"><div class="closing" style="grid-column:1/-1">${flower}<div class="eyebrow">Para guardar no coração</div><h1>Você faz parte<br>do nosso <em>sim.</em></h1><p>Nossa história é feita de pessoas especiais, e vocês fazem parte dela.</p><p>Obrigados por aceitarem caminhar conosco neste novo capítulo. Esperamos viver um dia inesquecível ao lado de cada um de vocês.</p><p class="fine">Com carinho,</p><div class="signature">Carlos & Karine</div><button class="primary-button" data-start>Voltar ao início ${arrow('left')}</button></div></div>`}
];
const main = document.querySelector('main.sheet');
const nav = document.querySelector('.chapters');
const cover = document.querySelector('.cover');
const coverBody = document.querySelector('.cover-body');
coverBody.innerHTML = `<section class="page" id="cap-0">${pages[0].html()}</section>`;
main.innerHTML = pages.slice(1).map((p,i)=>`<section class="page" id="cap-${i+1}">${p.html()}</section>`).join('');
nav.innerHTML = pages.map((page,i)=>`<button class="chapter" data-page="${i}"><span>${String(i+1).padStart(2,'0')}</span>${page.label}</button>`).join('');
const sections = [coverBody.firstElementChild, ...main.querySelectorAll('.page')];
const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function fx(){
if(calm)return;
const vh=window.innerHeight,navH=nav.offsetHeight;
const p=Math.min(1,Math.max(0,window.scrollY/vh));cover.style.transform=`translateY(${-p*14}%) scale(${1-p*.07})`;cover.style.opacity=String(1-p*.85);
for(let k=1;k<sections.length-1;k++){const nt=sections[k+1].getBoundingClientRect().top;const q=Math.min(1,Math.max(0,(vh-nt)/Math.max(1,vh-navH)));sections[k].style.transform=q?`translateY(${-q*vh*.08}px) scale(${1-q*.06})`:'';sections[k].style.opacity=q?String(1-q*.85):'';}
}
function layout(){const vh=window.innerHeight,navH=nav.offsetHeight;for(let k=1;k<sections.length;k++){const s=sections[k];s.style.top=Math.min(navH,vh-s.offsetHeight)+'px';s.style.zIndex=String(k+1);}}
let active = -1, locked = false, lockTimer;
function setNavHeight(){document.documentElement.style.setProperty('--navh', nav.offsetHeight+'px');layout();}
function setActive(i){
if(i===active)return;active=i;
[...nav.children].forEach((b,k)=>{b.classList.toggle('active',k===i);b.setAttribute('aria-current',k===i?'step':'false');});
const b=nav.children[i];nav.scrollTo({left:Math.max(0,b.offsetLeft-(nav.clientWidth-b.offsetWidth)/2),behavior:'smooth'});
}
function spy(){
if(locked)return;
const line = nav.offsetHeight + window.innerHeight*0.3;
let cur = 0;
sections.forEach((sec,k)=>{if(sec.getBoundingClientRect().top<=line)cur=k;});
if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4)cur=sections.length-1;
setActive(cur);
}
function goTo(i){
i=Math.max(0,Math.min(sections.length-1,i));
setActive(i);locked=true;clearTimeout(lockTimer);
if(i===0)window.scrollTo({top:0,behavior:'smooth'});
else{let y=main.getBoundingClientRect().top+window.scrollY;for(let j=1;j<i;j++)y+=sections[j].offsetHeight;window.scrollTo({top:Math.max(0,y-nav.offsetHeight),behavior:'smooth'});}
lockTimer=setTimeout(()=>{locked=false;spy();},900);
}
let ticking=false;
window.addEventListener('scroll',()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{fx();spy();ticking=false;});},{passive:true});
window.addEventListener('resize',()=>{setNavHeight();fx();spy();});
nav.addEventListener('click',e=>{const button=e.target.closest('[data-page]');if(button)goTo(Number(button.dataset.page));});
document.addEventListener('click',e=>{
if(e.target.closest('[data-next]'))goTo(Math.max(active,0)+1);
if(e.target.closest('[data-start]')){locked=true;setActive(0);window.scrollTo({top:0,behavior:'smooth'});clearTimeout(lockTimer);lockTimer=setTimeout(()=>{locked=false;spy();},900);}
});
setNavHeight();fx();spy();
window.addEventListener('load',()=>{setNavHeight();fx();spy();});
if(window.ResizeObserver){const ro=new ResizeObserver(()=>{layout();fx();});sections.forEach(s=>ro.observe(s));}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{setNavHeight();fx();spy();});
</script></body></html>
